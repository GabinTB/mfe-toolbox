site_name: mfe — Financial Econometrics for Python
site_url: https://mfe.readthedocs.io
repo_url: https://github.com/your-org/mfe-toolbox
repo_name: mfe-toolbox
site_description: >
  Python port of the Oxford MFE Toolbox — financial econometrics with HFT-optimised
  realized measures, multivariate GARCH, HAR models, and more.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guide/installation.md
    - Quick Start: guide/quickstart.md
    - vs. arch / statsmodels: guide/comparison.md
  - User Guide:
    - Realized Volatility: guide/realized.md
    - Multivariate GARCH: guide/multivariate.md
    - Univariate Models: guide/univariate.md
    - Time Series: guide/timeseries.md
    - Bootstrap Tests: guide/bootstrap.md
    - Cross-Section: guide/crosssection.md
    - Distributions: guide/distributions.md
  - API Reference:
    - mfe.realized: api/realized.md
    - mfe.multivariate: api/multivariate.md
    - mfe.univariate: api/univariate.md
    - mfe.timeseries: api/timeseries.md
    - mfe.bootstrap: api/bootstrap.md
    - mfe.crosssection: api/crosssection.md
    - mfe.tests_stat: api/tests_stat.md
    - mfe.distributions: api/distributions.md
    - mfe.utils: api/utils.md
  - Changelog: changelog.md
