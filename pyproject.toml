[project]
name = "mfe-toolbox"
version = "0.1.0"
description = "Python port of the MFE Toolbox — financial econometrics for HFT data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Gabin Taibi"}]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "arch>=6.2",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfe"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.9",
    "mypy>=1.9",
    "ipykernel>=7.0",
    "matplotlib>=3.8",
    "cython>=3.0",
    "setuptools>=69",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
